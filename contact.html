<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - CJ Fightworks</title>
  <link rel="stylesheet" href="contact.css">
</head>

<body>
  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="CJ Fightworks Logo">
    </div>
    <h1>Contact CJ Fightworks</h1>
    <p>Get in touch to start your training journey!</p>
  </header>

  <a class="whatsapp-btn" href="https://wa.me/+440777777777" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp"> Chat with us
  </a>

  <!-- Contact Form Container -->
  <main class="container">
    <h2 class="section-title">Send Us a Message</h2>
    <form action="#" method="post" class="contact-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" placeholder="Your message..." rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <!-- Background video -->
  <video class="video-bg" autoplay muted loop playsinline webkit-playsinline>
    <source src="assets/contact_video.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- Footer -->
  <footer>
    &copy; 2025 CJ Fightworks. All Rights Reserved.
  </footer>
</body>

</html>
